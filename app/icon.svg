<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <!--
    Le c du logotype, isolé.

    Un favicon doit tenir dans un carré de 16px : le mot entier y serait
    illisible. On garde donc l'initiale, avec exactement la même construction
    que dans « clearto » — anneau ouvert à 45° de part et d'autre, même
    rapport trait/hauteur, mêmes terminaisons arrondies — pour que l'onglet
    et l'en-tête se lisent comme la même main.
  -->
  <path d="M44.4 14.6 A19 19 0 1 0 44.4 41.4"
        fill="none" stroke="#c93f26" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
