<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <!--
    Le c du logotype, isolé.

    Un favicon doit tenir dans un carré de 16px : le mot entier y serait
    illisible. On garde donc l'initiale, avec exactement la même construction
    que dans « clearto » — anneau ouvert à 45° de part et d'autre, même
    épaisseur relative, mêmes terminaisons arrondies — pour que l'onglet et
    l'en-tête se lisent comme la même main.
  -->
  <path d="M38.7 13.3 A18 18 0 1 0 38.7 38.7"
        fill="none" stroke="#c93f26" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
